<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Six practical filmmaking tools in ShotPal Pro</title>
  <desc id="desc">Automatic storyboards, exact frame capture, audio ranges, local subtitles, music recognition, and traceable export.</desc>
  <rect x="1" y="1" width="1198" height="498" rx="30" fill="#0d1117" stroke="#30363d"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="42" y="55" fill="#f0f6fc" font-size="25" font-weight="650">One source timeline. Six ways to learn from it.</text><text x="42" y="83" fill="#8b949e" font-size="15">Each output remembers the film and time range that produced it.</text>
    <g transform="translate(42 116)"><rect width="348" height="145" rx="20" fill="#161b22" stroke="#30363d"/><text x="24" y="38" fill="#ff8b7e" font-size="13" font-weight="700" letter-spacing="1.5">SCENES</text><text x="24" y="73" fill="#f0f6fc" font-size="21" font-weight="650">Automatic storyboards</text><text x="24" y="104" fill="#8b949e" font-size="14">Navigate a long film by its real cuts.</text></g>
    <g transform="translate(426 116)"><rect width="348" height="145" rx="20" fill="#161b22" stroke="#30363d"/><text x="24" y="38" fill="#ffd06f" font-size="13" font-weight="700" letter-spacing="1.5">FRAMES</text><text x="24" y="73" fill="#f0f6fc" font-size="21" font-weight="650">Exact frame capture</text><text x="24" y="104" fill="#8b949e" font-size="14">Keep timecode, tags, notes, and color.</text></g>
    <g transform="translate(810 116)"><rect width="348" height="145" rx="20" fill="#161b22" stroke="#30363d"/><text x="24" y="38" fill="#7ce5ca" font-size="13" font-weight="700" letter-spacing="1.5">SOUND</text><text x="24" y="73" fill="#f0f6fc" font-size="21" font-weight="650">Waveform audio ranges</text><text x="24" y="104" fill="#8b949e" font-size="14">Mark In and Out without leaving playback.</text></g>
    <g transform="translate(42 289)"><rect width="348" height="145" rx="20" fill="#161b22" stroke="#30363d"/><text x="24" y="38" fill="#72b7ff" font-size="13" font-weight="700" letter-spacing="1.5">WORDS</text><text x="24" y="73" fill="#f0f6fc" font-size="21" font-weight="650">Local subtitles</text><text x="24" y="104" fill="#8b949e" font-size="14">Transcribe and follow speech on the timeline.</text></g>
    <g transform="translate(426 289)"><rect width="348" height="145" rx="20" fill="#1d192a" stroke="#8978ee"/><text x="24" y="38" fill="#ad9cf5" font-size="13" font-weight="700" letter-spacing="1.5">MUSIC</text><text x="24" y="73" fill="#f0f6fc" font-size="21" font-weight="650">Music recognition</text><text x="24" y="104" fill="#aaa1c9" font-size="14">Find songs, versions, artwork, and genres.</text></g>
    <g transform="translate(810 289)"><rect width="348" height="145" rx="20" fill="#161b22" stroke="#30363d"/><text x="24" y="38" fill="#f28fce" font-size="13" font-weight="700" letter-spacing="1.5">EXPORT</text><text x="24" y="73" fill="#f0f6fc" font-size="21" font-weight="650">Traceable material</text><text x="24" y="104" fill="#8b949e" font-size="14">Take useful pieces into the next edit.</text></g>
  </g>
</svg>
