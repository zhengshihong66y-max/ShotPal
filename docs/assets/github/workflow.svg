<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">From a source film to reusable material</title>
  <desc id="desc">Four steps: bring in a film, break it down, organize the useful parts, and reuse them in an edit.</desc>
  <defs><linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff6655"/><stop offset=".34" stop-color="#ffbd49"/><stop offset=".66" stop-color="#58d9b8"/><stop offset="1" stop-color="#8978ee"/></linearGradient></defs>
  <rect x="1" y="1" width="1198" height="308" rx="30" fill="#0d1117" stroke="#30363d"/>
  <text x="42" y="52" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="650" letter-spacing="2">THE SHOTPAL WORKFLOW</text><path d="M95 112H1105" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <g transform="translate(42 86)"><rect width="250" height="174" rx="22" fill="#161b22" stroke="#30363d"/><circle cx="42" cy="26" r="17" fill="#2a1617" stroke="#ff6655"/><text x="42" y="32" fill="#ff8b7e" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="24" y="82" fill="#f0f6fc" font-size="23" font-weight="650">Bring it in</text><text x="24" y="113" fill="#8b949e" font-size="15">Local video or a public link</text><text x="24" y="139" fill="#8b949e" font-size="15">with source details attached.</text></g>
    <g transform="translate(330 86)"><rect width="250" height="174" rx="22" fill="#161b22" stroke="#30363d"/><circle cx="42" cy="26" r="17" fill="#2b2414" stroke="#ffbd49"/><text x="42" y="32" fill="#ffd06f" font-size="15" font-weight="700" text-anchor="middle">2</text><text x="24" y="82" fill="#f0f6fc" font-size="23" font-weight="650">Break it down</text><text x="24" y="113" fill="#8b949e" font-size="15">Scenes, frames, waveforms,</text><text x="24" y="139" fill="#8b949e" font-size="15">subtitles, and music.</text></g>
    <g transform="translate(618 86)"><rect width="250" height="174" rx="22" fill="#161b22" stroke="#30363d"/><circle cx="42" cy="26" r="17" fill="#142a25" stroke="#58d9b8"/><text x="42" y="32" fill="#7ce5ca" font-size="15" font-weight="700" text-anchor="middle">3</text><text x="24" y="82" fill="#f0f6fc" font-size="23" font-weight="650">Organize it</text><text x="24" y="113" fill="#8b949e" font-size="15">Tag, filter, annotate, and</text><text x="24" y="139" fill="#8b949e" font-size="15">keep every item traceable.</text></g>
    <g transform="translate(906 86)"><rect width="250" height="174" rx="22" fill="#161b22" stroke="#30363d"/><circle cx="42" cy="26" r="17" fill="#211a32" stroke="#8978ee"/><text x="42" y="32" fill="#ad9cf5" font-size="15" font-weight="700" text-anchor="middle">4</text><text x="24" y="82" fill="#f0f6fc" font-size="23" font-weight="650">Use it again</text><text x="24" y="113" fill="#8b949e" font-size="15">Export or drag material into</text><text x="24" y="139" fill="#8b949e" font-size="15">the next creative tool.</text></g>
  </g>
</svg>
