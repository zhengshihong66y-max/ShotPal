<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">One film in. Reusable material out.</title>
  <desc id="desc">ShotPal Pro downloads source films, analyzes them locally, and outputs reusable creative material.</desc>
  <defs>
    <radialGradient id="warm" cx="0" cy="0" r="1" gradientTransform="translate(10 10) rotate(36) scale(380 290)"><stop stop-color="#ff6655" stop-opacity=".23"/><stop offset="1" stop-color="#ff6655" stop-opacity="0"/></radialGradient>
    <radialGradient id="mint" cx="0" cy="0" r="1" gradientTransform="translate(10 10) rotate(36) scale(380 290)"><stop stop-color="#58d9b8" stop-opacity=".21"/><stop offset="1" stop-color="#58d9b8" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(10 10) rotate(36) scale(380 290)"><stop stop-color="#8978ee" stop-opacity=".24"/><stop offset="1" stop-color="#8978ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="downloadAccent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff735f"/><stop offset="1" stop-color="#ffc45f"/></linearGradient>
    <linearGradient id="analyzeAccent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72e3a1"/><stop offset="1" stop-color="#5bc9f5"/></linearGradient>
    <linearGradient id="outputAccent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65c9ff"/><stop offset="1" stop-color="#ab7cf2"/></linearGradient>
  </defs>

  <rect width="1200" height="430" rx="30" fill="#111113"/>

  <g font-family="SF Pro SC, SF Pro Display, SF Pro Text, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <text x="600" y="72" fill="#f5f5f7" font-size="45" font-weight="600" letter-spacing="-1.15" text-anchor="middle">One film in. Reusable material out.</text>

    <g transform="translate(36 116)">
      <rect width="360" height="274" rx="28" fill="#1c1c1e" stroke="#ff735f" stroke-opacity=".24"/>
      <rect width="360" height="274" rx="28" fill="url(#warm)"/>
      <g transform="translate(26 83)">
        <rect width="82" height="82" rx="24" fill="#241917" stroke="#ff735f" stroke-opacity=".60"/>
        <path d="M41 18v34m-13-13 13 13 13-13M25 64h32" fill="none" stroke="url(#downloadAccent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="132" y="104" fill="#f5f5f7" font-size="32" font-weight="600" letter-spacing="-.25">Download</text>
      <text x="132" y="143" fill="#b8b8bd" font-size="18" font-weight="400">Bring public links</text>
      <text x="132" y="171" fill="#b8b8bd" font-size="18" font-weight="400">or local films into</text>
      <text x="132" y="199" fill="#b8b8bd" font-size="18" font-weight="400">one source library.</text>
    </g>

    <g transform="translate(420 116)">
      <rect width="360" height="274" rx="28" fill="#1c1c1e" stroke="#58d9b8" stroke-opacity=".24"/>
      <rect width="360" height="274" rx="28" fill="url(#mint)"/>
      <g transform="translate(26 83)">
        <rect width="82" height="82" rx="24" fill="#152320" stroke="#58d9b8" stroke-opacity=".60"/>
        <circle cx="36" cy="35" r="17" fill="none" stroke="url(#analyzeAccent)" stroke-width="4"/>
        <path d="M48 48l16 16" fill="none" stroke="url(#analyzeAccent)" stroke-width="4" stroke-linecap="round"/>
        <path d="M26 37l6-7 6 5 7-10" fill="none" stroke="url(#analyzeAccent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="132" y="104" fill="#f5f5f7" font-size="32" font-weight="600" letter-spacing="-.25">Analyze</text>
      <text x="132" y="143" fill="#b8b8bd" font-size="18" font-weight="400">Find scenes, frames,</text>
      <text x="132" y="171" fill="#b8b8bd" font-size="18" font-weight="400">sound, speech, and</text>
      <text x="132" y="199" fill="#b8b8bd" font-size="18" font-weight="400">music locally.</text>
    </g>

    <g transform="translate(804 116)">
      <rect width="360" height="274" rx="28" fill="#1c1c1e" stroke="#8978ee" stroke-opacity=".28"/>
      <rect width="360" height="274" rx="28" fill="url(#violet)"/>
      <g transform="translate(26 83)">
        <rect width="82" height="82" rx="24" fill="#1d1928" stroke="#8978ee" stroke-opacity=".65"/>
        <path d="M22 55v9h42V22h-9" fill="none" stroke="url(#outputAccent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M38 20h25v25M63 20 35 48" fill="none" stroke="url(#outputAccent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="132" y="104" fill="#f5f5f7" font-size="32" font-weight="600" letter-spacing="-.25">Output</text>
      <text x="132" y="143" fill="#b8b8bd" font-size="18" font-weight="400">Export or drag useful</text>
      <text x="132" y="171" fill="#b8b8bd" font-size="18" font-weight="400">material straight into</text>
      <text x="132" y="199" fill="#b8b8bd" font-size="18" font-weight="400">your next edit.</text>
    </g>
  </g>
</svg>
