<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="glassFill" x1="220" y1="326" x2="780" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="0.42" stop-color="#EEF9FF" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#D6F3FF" stop-opacity="0.54"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="96" y1="334" x2="928" y2="686" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="0.5" stop-color="#D9F7FF" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shine" x1="142" y1="328" x2="574" y2="742" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.70"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#003F9C" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.18"/>
    </filter>
    <clipPath id="clipLeft">
      <rect x="-76" y="382" width="456" height="244" rx="54"/>
    </clipPath>
    <clipPath id="clipMid">
      <rect x="430" y="382" width="286" height="244" rx="54"/>
    </clipPath>
    <clipPath id="clipRight">
      <rect x="770" y="382" width="366" height="244" rx="54"/>
    </clipPath>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="-76" y="382" width="456" height="244" rx="54" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="4"/>
    <rect x="430" y="382" width="286" height="244" rx="54" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="4"/>
    <rect x="770" y="382" width="366" height="244" rx="54" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="4"/>
