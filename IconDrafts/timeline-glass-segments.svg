    <path clip-path="url(#clipMid)" d="M468 400 C522 378 628 392 696 438" fill="none" stroke="url(#shine)" stroke-width="38" stroke-linecap="round"/>
    <path clip-path="url(#clipRight)" d="M820 400 C916 370 1018 384 1118 442" fill="none" stroke="url(#shine)" stroke-width="42" stroke-linecap="round"/>
  </g>

  <g opacity="0.20">
